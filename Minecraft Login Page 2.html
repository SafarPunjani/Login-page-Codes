<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>Minecraft Login</title> <style> @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap'); * { margin: 0; padding: 0; box-sizing: border-box; } :root { --dirt-brown: #8B4513; --grass-green: #567D46; --stone-gray: #888888; --wood-brown: #A0522D; --sky-blue: #87CEEB; --dark-green: #228B22; } body { font-family: 'VT323', monospace; overflow: hidden; image-rendering: pixelated; -webkit-font-smoothing: none; } /* ===== MINECRAFT WORLD BACKGROUND ===== */ .minecraft-world { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 50%, #98FB98 100%); overflow: hidden; } /* Sky with clouds */ .sky { position: absolute; top: 0; left: 0; width: 100%; height: 60%; background: linear-gradient(180deg, #4A90C2 0%, #87CEEB 50%, #B0E0E6 100%); } .cloud { position: absolute; background: #fff; border-radius: 0; opacity: 0.9; animation: cloudMove 60s linear infinite; } .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; } @keyframes cloudMove { 0% { transform: translateX(-100px); } 100% { transform: translateX(calc(100vw + 200px)); } } /* Ground layers */ .ground { position: absolute; bottom: 0; left: 0; width: 200%; height: 45%; display: flex; flex-direction: column; } .grass-layer { height: 8px; background: repeating-linear-gradient( 90deg, #567D46 0px, #567D46 16px, #4A6B3C 16px, #4A6B3C 32px, #628B52 32px, #628B52 48px ); box-shadow: 0 -2px 0 #3D5C30; } .dirt-layer { flex: 1; background: repeating-linear-gradient( 0deg, #8B5A2B 0px, #8B5A2B 16px, #7A4E24 16px, #7A4E24 32px ), repeating-linear-gradient( 90deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 16px, transparent 16px, transparent 32px ); } /* Trees */ .tree { position: absolute; bottom: 45%; z-index: 5; } .tree-trunk { width: 24px; height: 60px; background: repeating-linear-gradient( 0deg, #6B4423 0px, #6B4423 8px, #5D3A1F 8px, #5D3A1F 16px ); margin: 0 auto; position: relative; } .tree-leaves { width: 72px; height: 72px; background: #228B22; position: relative; left: -24px; box-shadow: inset 8px 8px 0 #2EA82E, inset -8px -8px 0 #1B6B1B; } .tree-leaves::before { content: ''; position: absolute; top: -24px; left: 12px; width: 48px; height: 24px; background: #228B22; box-shadow: inset 4px 4px 0 #2EA82E, inset -4px -4px 0 #1B6B1B; } /* Minecraft Characters */ .character { position: absolute; bottom: 45%; z-index: 10; image-rendering: pixelated; } /* Steve Character */ .steve { width: 32px; height: 64px; animation: steveWalk 4s steps(2) infinite; } .steve-head { width: 32px; height: 32px; background: linear-gradient(180deg, #4A3728 0%, #4A3728 30%, #C69C6D 30%, #C69C6D 100%); position: relative; box-shadow: inset 8px 12px 0 4px #4A3728, inset -8px 12px 0 4px #4A3728; } .steve-head::before { content: ''; position: absolute; top: 14px; left: 4px; width: 6px; height: 6px; background: #fff; box-shadow: 18px 0 0 #fff, 3px 3px 0 #2D1F1A, 21px 3px 0 #2D1F1A; } .steve-head::after { content: ''; position: absolute; bottom: 4px; left: 10px; width: 12px; height: 4px; background: #8B6F5A; } .steve-body { width: 32px; height: 24px; background: #3CBCFC; box-shadow: inset 0 0 0 4px #2D9BD8; } .steve-legs { width: 32px; height: 8px; background: linear-gradient(90deg, #3A3A5C 50%, #2D2D47 50%); animation: legMove 0.5s steps(2) infinite; } @keyframes steveWalk { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } } @keyframes legMove { 0%, 100% { background: linear-gradient(90deg, #3A3A5C 50%, #2D2D47 50%); } 50% { background: linear-gradient(90deg, #2D2D47 50%, #3A3A5C 50%); } } /* Alex Character */ .alex { width: 28px; height: 56px; } .alex-head { width: 28px; height: 28px; background: linear-gradient(180deg, #D97B2A 0%, #D97B2A 35%, #DFAB8A 35%); position: relative; } .alex-head::before { content: ''; position: absolute; top: 12px; left: 4px; width: 5px; height: 5px; background: #6DA86D; box-shadow: 15px 0 0 #6DA86D; } .alex-body { width: 28px; height: 20px; background: #6DA86D; box-shadow: inset 0 0 0 3px #5A8F5A; } .alex-legs { width: 28px; height: 8px; background: linear-gradient(90deg, #3A3A5C 50%, #2D2D47 50%); animation: legMove 0.6s steps(2) infinite; } /* Animals */ .pig { width: 40px; height: 28px; position: absolute; bottom: 45%; z-index: 8; animation: animalWalk 8s linear infinite; } .pig-body { width: 40px; height: 20px; background: #F5A9B8; border-radius: 0; position: relative; box-shadow: inset 4px 4px 0 #FFB6C1, inset -4px -4px 0 #E091A0; } .pig-head { position: absolute; left: -12px; top: 2px; width: 16px; height: 16px; background: #F5A9B8; box-shadow: inset 2px 2px 0 #FFB6C1; } .pig-head::before { content: ''; position: absolute; top: 4px; left: 2px; width: 3px; height: 3px; background: #333; box-shadow: 8px 0 0 #333; } .pig-head::after { content: ''; position: absolute; bottom: 2px; left: 4px; width: 8px; height: 5px; background: #E091A0; } .pig-legs { display: flex; justify-content: space-between; padding: 0 4px; } .pig-leg { width: 6px; height: 8px; background: #E091A0; animation: pigLegMove 0.3s steps(2) infinite; } @keyframes animalWalk { 0% { transform: translateX(-100px); } 100% { transform: translateX(calc(100vw + 100px)); } } @keyframes pigLegMove { 0%, 100% { height: 8px; } 50% { height: 6px; } } /* Cow */ .cow { width: 48px; height: 32px; position: absolute; bottom: 45%; z-index: 8; animation: animalWalk 12s linear infinite reverse; } .cow-body { width: 48px; height: 24px; background: repeating-linear-gradient( 90deg, #3D3D3D 0px, #3D3D3D 8px, #F5F5F5 8px, #F5F5F5 16px ); position: relative; } .cow-head { position: absolute; right: -14px; top: 4px; width: 18px; height: 16px; background: #F5F5F5; } .cow-head::before { content: ''; position: absolute; top: 3px; left: 3px; width: 3px; height: 3px; background: #333; box-shadow: 8px 0 0 #333; } .cow-legs { display: flex; justify-content: space-between; padding: 0 6px; } .cow-leg { width: 6px; height: 8px; background: #F5F5F5; } /* Chicken */ .chicken { width: 16px; height: 20px; position: absolute; bottom: 45%; z-index: 9; animation: chickenWalk 6s linear infinite; } .chicken-body { width: 16px; height: 14px; background: #F5F5F5; position: relative; border-radius: 0; } .chicken-head { position: absolute; top: -6px; left: 2px; width: 10px; height: 10px; background: #F5F5F5; } .chicken-head::before { content: ''; position: absolute; top: 2px; left: 2px; width: 2px; height: 2px; background: #333; } .chicken-head::after { content: ''; position: absolute; top: 4px; left: -3px; width: 4px; height: 3px; background: #FFA500; } .chicken-comb { position: absolute; top: -10px; left: 4px; width: 6px; height: 4px; background: #FF0000; } .chicken-legs { display: flex; justify-content: center; gap: 4px; } .chicken-leg { width: 2px; height: 6px; background: #FFA500; } @keyframes chickenWalk { 0% { transform: translateX(-50px) scaleX(1); } 49% { transform: translateX(calc(100vw + 50px)) scaleX(1); } 50% { transform: translateX(calc(100vw + 50px)) scaleX(-1); } 99% { transform: translateX(-50px) scaleX(-1); } 100% { transform: translateX(-50px) scaleX(1); } } /* Sheep */ .sheep { width: 36px; height: 28px; position: absolute; bottom: 45%; z-index: 7; animation: sheepGraze 5s ease-in-out infinite; } .sheep-body { width: 36px; height: 20px; background: #F0F0F0; position: relative; box-shadow: 4px 0 0 #E0E0E0, -4px 0 0 #E0E0E0, 0 4px 0 #E0E0E0, 0 -4px 0 #E0E0E0; } .sheep-head { position: absolute; left: -10px; top: 6px; width: 12px; height: 10px; background: #8B8B8B; } .sheep-head::before { content: ''; position: absolute; top: 2px; left: 2px; width: 2px; height: 2px; background: #333; box-shadow: 5px 0 0 #333; } .sheep-legs { display: flex; justify-content: space-between; padding: 0 4px; } .sheep-leg { width: 5px; height: 8px; background: #8B8B8B; } @keyframes sheepGraze { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } } /* Farmer Steve with hoe */ .farmer { animation: farming 3s ease-in-out infinite; } .farmer .tool { position: absolute; top: 20px; right: -20px; width: 4px; height: 30px; background: #8B4513; transform-origin: bottom center; animation: toolSwing 1.5s ease-in-out infinite; } .farmer .tool::before { content: ''; position: absolute; top: 0; left: -6px; width: 16px; height: 6px; background: #888; } @keyframes farming { 0%, 100% { transform: translateY(0); } 25% { transform: translateY(-3px); } 75% { transform: translateY(2px); } } @keyframes toolSwing { 0%, 100% { transform: rotate(-30deg); } 50% { transform: rotate(30deg); } } /* Crops */ .crops { position: absolute; bottom: 45%; display: flex; gap: 16px; z-index: 4; } .crop { width: 16px; height: 24px; background: linear-gradient(0deg, #8B5A2B 0%, #8B5A2B 30%, #4CAF50 30%); position: relative; } .crop::before { content: ''; position: absolute; top: 0; left: 4px; width: 8px; height: 10px; background: #FFD700; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); } .crop:nth-child(odd)::before { background: #4CAF50; height: 14px; } /* Sun */ .sun { position: absolute; top: 10%; right: 15%; width: 60px; height: 60px; background: #FFD93D; box-shadow: 0 0 60px #FFD93D, inset 8px 8px 0 #FFE066; animation: sunPulse 4s ease-in-out infinite; } @keyframes sunPulse { 0%, 100% { box-shadow: 0 0 60px #FFD93D, inset 8px 8px 0 #FFE066; } 50% { box-shadow: 0 0 80px #FFD93D, inset 8px 8px 0 #FFE066; } } /* Houses */ .house { position: absolute; bottom: 45%; z-index: 3; } .house-base { width: 80px; height: 60px; background: repeating-linear-gradient( 0deg, #A0522D 0px, #A0522D 8px, #8B4513 8px, #8B4513 16px ); position: relative; } .house-door { position: absolute; bottom: 0; left: 28px; width: 24px; height: 36px; background: #5D3A1F; box-shadow: inset 4px 4px 0 #7A4E24; } .house-window { position: absolute; top: 10px; width: 16px; height: 16px; background: #87CEEB; border: 3px solid #5D3A1F; } .house-window.left { left: 6px; } .house-window.right { right: 6px; } .house-roof { position: absolute; top: -30px; left: -10px; width: 0; height: 0; border-left: 50px solid transparent; border-right: 50px solid transparent; border-bottom: 30px solid #8B0000; } /* ===== LOGIN CONTAINER ===== */ .login-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px; } .login-box { background: rgba(0, 0, 0, 0.7); border: 4px solid #555; box-shadow: inset 4px 4px 0 rgba(255,255,255,0.1), inset -4px -4px 0 rgba(0,0,0,0.3), 8px 8px 0 rgba(0,0,0,0.5); padding: 30px; width: 100%; max-width: 400px; animation: boxAppear 0.5s ease-out; } @keyframes boxAppear { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } } .login-title { text-align: center; color: #fff; font-size: 2.5rem; text-shadow: 4px 4px 0 #3F3F3F, -2px -2px 0 #000; margin-bottom: 30px; letter-spacing: 4px; } .login-title span { color: #5D5; animation: titlePulse 2s ease-in-out infinite; } @keyframes titlePulse { 0%, 100% { color: #5D5; } 50% { color: #8F8; } } /* Input fields */ .input-group { margin-bottom: 20px; } .input-label { display: block; color: #AAA; font-size: 1.2rem; margin-bottom: 8px; text-shadow: 2px 2px 0 #000; } .minecraft-input { width: 100%; padding: 15px; font-family: 'VT323', monospace; font-size: 1.3rem; background: rgba(0, 0, 0, 0.5); border: 3px solid #555; color: #fff; box-shadow: inset 3px 3px 0 rgba(0,0,0,0.5), inset -2px -2px 0 rgba(255,255,255,0.05); transition: all 0.2s; outline: none; } .minecraft-input:focus { border-color: #5D5; box-shadow: inset 3px 3px 0 rgba(0,0,0,0.5), inset -2px -2px 0 rgba(255,255,255,0.05), 0 0 20px rgba(93, 221, 93, 0.3); } .minecraft-input::placeholder { color: #666; } /* Steve Head Login Button */ .login-btn-container { display: flex; justify-content: center; margin-top: 30px; } .steve-login-btn { width: 80px; height: 80px; cursor: pointer; position: relative; transition: transform 0.1s; animation: buttonFloat 2s ease-in-out infinite; } @keyframes buttonFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } } .steve-login-btn:hover { animation: none; transform: scale(1.1); } .steve-login-btn:active { transform: scale(0.95); } .steve-head-btn { width: 80px; height: 80px; position: relative; image-rendering: pixelated; } /* Steve head front face */ .steve-face { width: 80px; height: 80px; background: linear-gradient(180deg, #4A3728 0%, #4A3728 25%, #C69C6D 25%, #C69C6D 100% ); position: relative; box-shadow: inset 8px 0 0 #3D2D20, inset -8px 0 0 #3D2D20, 4px 4px 0 rgba(0,0,0,0.5); } /* Hair detail */ .steve-face::before { content: ''; position: absolute; top: 18px; left: 10px; width: 60px; height: 8px; background: #4A3728; } /* Eyes */ .steve-eyes { position: absolute; top: 35px; left: 12px; width: 16px; height: 16px; background: #fff; box-shadow: 40px 0 0 #fff; } .steve-eyes::before { content: ''; position: absolute; top: 4px; left: 4px; width: 8px; height: 8px; background: #5D4037; box-shadow: 40px 0 0 #5D4037; animation: eyeMove 3s ease-in-out infinite; } @keyframes eyeMove { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(2px); } 75% { transform: translateX(-2px); } } /* Nose */ .steve-nose { position: absolute; top: 45px; left: 34px; width: 12px; height: 8px; background: #B08968; } /* Mouth */ .steve-mouth { position: absolute; bottom: 12px; left: 28px; width: 24px; height: 6px; background: #8B6F5A; } .login-btn-text { text-align: center; color: #5D5; font-size: 1.5rem; margin-top: 15px; text-shadow: 2px 2px 0 #000; animation: textPulse 1.5s ease-in-out infinite; } @keyframes textPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } } /* Click effect */ .click-effect { position: fixed; width: 20px; height: 20px; background: #5D5; pointer-events: none; animation: clickPop 0.4s ease-out forwards; z-index: 1000; } @keyframes clickPop { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(3); opacity: 0; } } /* ===== WELCOME SCREEN ===== */ .welcome-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; display: none; overflow: hidden; } .welcome-screen.active { display: block; animation: screenFadeIn 1s ease-out; } @keyframes screenFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } } /* 3D World Canvas */ .world-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; } .welcome-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; color: #fff; text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 40px rgba(255,255,255,0.5); text-align: center; z-index: 10; animation: welcomeAppear 1s ease-out 0.5s both; letter-spacing: 6px; } @keyframes welcomeAppear { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.1); } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } } .welcome-text span { display: block; font-size: 4rem; color: #5D5; animation: minecraftGlow 2s ease-in-out infinite; } @keyframes minecraftGlow { 0%, 100% { text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 0 0 20px #5D5, 0 0 40px #5D5; } 50% { text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 0 0 40px #5D5, 0 0 80px #5D5; } } /* Particles */ .particle { position: absolute; width: 8px; height: 8px; background: #5D5; animation: particleFloat 3s ease-in-out infinite; } @keyframes particleFloat { 0%, 100% { transform: translateY(0) rotate(0deg); opacity: 1; } 50% { transform: translateY(-100px) rotate(180deg); opacity: 0.5; } } /* Loading animation */ .loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; justify-content: center; align-items: center; z-index: 150; flex-direction: column; } .loading.active { display: flex; } .loading-bar-container { width: 300px; height: 20px; background: #333; border: 3px solid #555; overflow: hidden; } .loading-bar { height: 100%; background: linear-gradient(90deg, #5D5, #3A3); width: 0%; animation: loadingProgress 2s ease-in-out forwards; } @keyframes loadingProgress { 0% { width: 0%; } 100% { width: 100%; } } .loading-text { color: #fff; font-size: 1.5rem; margin-top: 20px; animation: loadingDots 1s steps(3) infinite; } @keyframes loadingDots { 0% { content: 'Loading'; } 33% { content: 'Loading.'; } 66% { content: 'Loading..'; } 100% { content: 'Loading...'; } } /* ===== RESPONSIVE DESIGN ===== */ /* Mobile First */ @media (max-width: 480px) { .login-box { padding: 20px; margin: 10px; } .login-title { font-size: 2rem; } .minecraft-input { padding: 12px; font-size: 1.1rem; } .steve-login-btn { width: 70px; height: 70px; } .steve-face { width: 70px; height: 70px; } .steve-eyes { top: 30px; left: 10px; width: 14px; height: 14px; box-shadow: 32px 0 0 #fff; } .steve-eyes::before { width: 6px; height: 6px; box-shadow: 32px 0 0 #5D4037; } .steve-nose { top: 38px; left: 28px; width: 10px; height: 6px; } .steve-mouth { bottom: 10px; left: 24px; width: 20px; height: 5px; } .welcome-text { font-size: 2rem; padding: 0 20px; } .welcome-text span { font-size: 2.5rem; } .sun { width: 40px; height: 40px; } .tree { transform: scale(0.7); } .house { transform: scale(0.6); } .character { transform: scale(0.8); } } @media (min-width: 481px) and (max-width: 768px) { .login-box { padding: 25px; } .login-title { font-size: 2.2rem; } .welcome-text { font-size: 2.5rem; } .welcome-text span { font-size: 3rem; } } /* Desktop / PC enhancements */ @media (min-width: 769px) { .login-box { padding: 40px; max-width: 450px; } .login-title { font-size: 3rem; } .minecraft-input { padding: 18px; font-size: 1.4rem; } .steve-login-btn { width: 100px; height: 100px; } .steve-face { width: 100px; height: 100px; } .steve-eyes { top: 44px; left: 15px; width: 20px; height: 20px; box-shadow: 50px 0 0 #fff; } .steve-eyes::before { width: 10px; height: 10px; box-shadow: 50px 0 0 #5D4037; } .steve-nose { top: 56px; left: 42px; width: 16px; height: 10px; } .steve-mouth { bottom: 15px; left: 35px; width: 30px; height: 8px; } .welcome-text { font-size: 4rem; } .welcome-text span { font-size: 5rem; } .sun { width: 80px; height: 80px; } .tree { transform: scale(1.2); } .house { transform: scale(1.1); } .character { transform: scale(1.2); } /* Enhanced shadows for PC */ .login-box { box-shadow: inset 4px 4px 0 rgba(255,255,255,0.1), inset -4px -4px 0 rgba(0,0,0,0.3), 12px 12px 0 rgba(0,0,0,0.5), 0 0 60px rgba(0,0,0,0.3); } } @media (min-width: 1200px) { .login-box { max-width: 500px; padding: 50px; } .steve-login-btn { width: 120px; height: 120px; } .steve-face { width: 120px; height: 120px; } .steve-eyes { top: 52px; left: 18px; width: 24px; height: 24px; box-shadow: 60px 0 0 #fff; } .steve-eyes::before { width: 12px; height: 12px; box-shadow: 60px 0 0 #5D4037; } .steve-nose { top: 68px; left: 50px; width: 20px; height: 12px; } .steve-mouth { bottom: 18px; left: 42px; width: 36px; height: 10px; } /* More detailed world for large screens */ .ground { height: 40%; } } /* Touch device optimizations */ @media (hover: none) and (pointer: coarse) { .steve-login-btn:hover { transform: none; } .minecraft-input { font-size: 16px; /* Prevents zoom on iOS */ } } </style> </head> <body> <!-- Minecraft World Background --> <div class="minecraft-world" id="minecraftWorld"> <div class="sky"> <div class="sun"></div> </div> <div class="ground"> <div class="grass-layer"></div> <div class="dirt-layer"></div> </div> <!-- Clouds will be added by JS --> <div id="clouds"></div> <!-- Trees --> <div class="tree" style="left: 5%;"> <div class="tree-leaves"></div> <div class="tree-trunk"></div> </div> <div class="tree" style="left: 25%;"> <div class="tree-leaves"></div> <div class="tree-trunk"></div> </div> <div class="tree" style="left: 75%;"> <div class="tree-leaves"></div> <div class="tree-trunk"></div> </div> <div class="tree" style="left: 90%;"> <div class="tree-leaves"></div> <div class="tree-trunk"></div> </div> <!-- House --> <div class="house" style="left: 45%;"> <div class="house-roof"></div> <div class="house-base"> <div class="house-window left"></div> <div class="house-window right"></div> <div class="house-door"></div> </div> </div> <!-- Crops --> <div class="crops" style="left: 60%;"> <div class="crop"></div> <div class="crop"></div> <div class="crop"></div> <div class="crop"></div> <div class="crop"></div> <div class="crop"></div> </div> <!-- Characters --> <div class="character steve" style="left: 15%;" id="steve1"> <div class="steve-head"></div> <div class="steve-body"></div> <div class="steve-legs"></div> </div> <div class="character farmer" style="left: 55%;"> <div class="steve-head"></div> <div class="steve-body"></div> <div class="steve-legs"></div> <div class="tool"></div> </div> <div class="character alex" style="left: 35%;"> <div class="alex-head"></div> <div class="alex-body"></div> <div class="alex-legs"></div> </div> <!-- Animals --> <div class="pig" style="left: 10%; animation-delay: -2s;"> <div class="pig-body"> <div class="pig-head"></div> </div> <div class="pig-legs"> <div class="pig-leg"></div> <div class="pig-leg"></div> <div class="pig-leg"></div> <div class="pig-leg"></div> </div> </div> <div class="cow" style="left: 70%; animation-delay: -5s;"> <div class="cow-body"> <div class="cow-head"></div> </div> <div class="cow-legs"> <div class="cow-leg"></div> <div class="cow-leg"></div> <div class="cow-leg"></div> <div class="cow-leg"></div> </div> </div> <div class="chicken" style="left: 40%; animation-delay: -1s;"> <div class="chicken-body"> <div class="chicken-head"> <div class="chicken-comb"></div> </div> </div> <div class="chicken-legs"> <div class="chicken-leg"></div> <div class="chicken-leg"></div> </div> </div> <div class="chicken" style="left: 80%; animation-delay: -3s;"> <div class="chicken-body"> <div class="chicken-head"> <div class="chicken-comb"></div> </div> </div> <div class="chicken-legs"> <div class="chicken-leg"></div> <div class="chicken-leg"></div> </div> </div> <div class="sheep" style="left: 20%;"> <div class="sheep-body"> <div class="sheep-head"></div> </div> <div class="sheep-legs"> <div class="sheep-leg"></div> <div class="sheep-leg"></div> <div class="sheep-leg"></div> <div class="sheep-leg"></div> </div> </div> <div class="pig" style="left: 85%; animation-delay: -7s;"> <div class="pig-body"> <div class="pig-head"></div> </div> <div class="pig-legs"> <div class="pig-leg"></div> <div class="pig-leg"></div> <div class="pig-leg"></div> <div class="pig-leg"></div> </div> </div> </div> <!-- Login Container --> <div class="login-container" id="loginContainer"> <div class="login-box"> <h1 class="login-title"> <span>MINECRAFT</span> LOGIN </h1> <div class="input-group"> <label class="input-label">Player Name</label> <input type="text" class="minecraft-input" id="username" placeholder="Enter your username..." autocomplete="off"> </div> <div class="input-group"> <label class="input-label">Password</label> <input type="password" class="minecraft-input" id="password" placeholder="Enter your password..."> </div> <div class="login-btn-container"> <div class="steve-login-btn" id="loginBtn" role="button" tabindex="0"> <div class="steve-head-btn"> <div class="steve-face"> <div class="steve-eyes"></div> <div class="steve-nose"></div> <div class="steve-mouth"></div> </div> </div> </div> </div> <div class="login-btn-text">Click Steve to Login</div> </div> </div> <!-- Loading Screen --> <div class="loading" id="loadingScreen"> <div class="loading-bar-container"> <div class="loading-bar"></div> </div> <div class="loading-text">Loading World...</div> </div> <!-- Welcome Screen --> <div class="welcome-screen" id="welcomeScreen"> <canvas class="world-canvas" id="worldCanvas"></canvas> <div class="welcome-text"> Welcome to <span>MINECRAFT WORLD</span> </div> </div> <script> // ===== INITIALIZATION ===== document.addEventListener('DOMContentLoaded', function() { initClouds(); initClickEffects(); initLoginButton(); initInputAnimations(); moveCharacters(); }); // ===== CLOUDS GENERATION ===== function initClouds() { const cloudsContainer = document.getElementById('clouds'); const numClouds = window.innerWidth > 768 ? 8 : 5; for (let i = 0; i < numClouds; i++) { const cloud = document.createElement('div'); cloud.className = 'cloud'; cloud.style.cssText = ` left: ${Math.random() * 100}%; top: ${5 + Math.random() * 25}%; width: ${40 + Math.random() * 60}px; height: ${20 + Math.random() * 20}px; animation-delay: ${-Math.random() * 60}s; animation-duration: ${40 + Math.random() * 40}s; `; cloudsContainer.appendChild(cloud); } } // ===== CLICK EFFECTS ===== function initClickEffects() { document.addEventListener('click', function(e) { createClickEffect(e.clientX, e.clientY); }); } function createClickEffect(x, y) { const effect = document.createElement('div'); effect.className = 'click-effect'; effect.style.left = x - 10 + 'px'; effect.style.top = y - 10 + 'px'; document.body.appendChild(effect); setTimeout(() => effect.remove(), 400); } // ===== CHARACTER MOVEMENT ===== function moveCharacters() { const steve = document.getElementById('steve1'); let direction = 1; let position = 15; setInterval(() => { position += direction * 0.5; if (position > 30) direction = -1; if (position < 10) direction = 1; steve.style.left = position + '%'; steve.style.transform = direction === 1 ? 'scaleX(1)' : 'scaleX(-1)'; }, 100); } // ===== INPUT ANIMATIONS ===== function initInputAnimations() { const inputs = document.querySelectorAll('.minecraft-input'); inputs.forEach(input => { input.addEventListener('focus', function() { this.parentElement.style.transform = 'scale(1.02)'; }); input.addEventListener('blur', function() { this.parentElement.style.transform = 'scale(1)'; }); // Typing sound simulation (visual feedback) input.addEventListener('input', function() { this.style.borderColor = '#5D5'; setTimeout(() => { if (document.activeElement !== this) { this.style.borderColor = '#555'; } }, 100); }); }); } // ===== LOGIN BUTTON ===== function initLoginButton() { const loginBtn = document.getElementById('loginBtn'); const loginContainer = document.getElementById('loginContainer'); const loadingScreen = document.getElementById('loadingScreen'); const welcomeScreen = document.getElementById('welcomeScreen'); function handleLogin() { const username = document.getElementById('username').value; const password = document.getElementById('password').value; // Button press animation loginBtn.style.transform = 'scale(0.9)'; setTimeout(() => { loginBtn.style.transform = 'scale(1)'; }, 100); // Show loading screen setTimeout(() => { loginContainer.style.display = 'none'; loadingScreen.classList.add('active'); // After loading, show welcome screen setTimeout(() => { loadingScreen.classList.remove('active'); welcomeScreen.classList.add('active'); initWelcomeWorld(); createParticles(); }, 2200); }, 200); } loginBtn.addEventListener('click', handleLogin); loginBtn.addEventListener('keypress', function(e) { if (e.key === 'Enter') handleLogin(); }); } // ===== WELCOME WORLD (3D Canvas) ===== function initWelcomeWorld() { const canvas = document.getElementById('worldCanvas'); const ctx = canvas.getContext('2d'); // Set canvas size function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } resizeCanvas(); window.addEventListener('resize', resizeCanvas); // Random camera position const cameraPositions = ['plains', 'forest', 'mountains', 'desert', 'ocean']; const selectedWorld = cameraPositions[Math.floor(Math.random() * cameraPositions.length)]; // World colors based on biome const biomes = { plains: { sky: ['#87CEEB', '#B0E0E6'], ground: '#567D46', dirt: '#8B5A2B', features: 'grass' }, forest: { sky: ['#6B8E6B', '#9ACD32'], ground: '#2E5A2E', dirt: '#5D3A1F', features: 'trees' }, mountains: { sky: ['#4682B4', '#87CEEB'], ground: '#696969', dirt: '#555555', features: 'peaks' }, desert: { sky: ['#FFD700', '#FFA500'], ground: '#D2B48C', dirt: '#C4A060', features: 'cactus' }, ocean: { sky: ['#0077BE', '#00CED1'], ground: '#006994', dirt: '#C4A060', features: 'waves' } }; const currentBiome = biomes[selectedWorld]; let animationFrame = 0; let cameraX = 0; let cameraY = 0; let targetX = (Math.random() - 0.5) * 100; let targetY = (Math.random() - 0.5) * 50; function drawWorld() { ctx.clearRect(0, 0, canvas.width, canvas.height); // Camera movement cameraX += (targetX - cameraX) * 0.01; cameraY += (targetY - cameraY) * 0.01; if (Math.abs(targetX - cameraX) < 1) { targetX = (Math.random() - 0.5) * 100; } if (Math.abs(targetY - cameraY) < 1) { targetY = (Math.random() - 0.5) * 50; } // Draw sky gradient const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6); skyGradient.addColorStop(0, currentBiome.sky[0]); skyGradient.addColorStop(1, currentBiome.sky[1]); ctx.fillStyle = skyGradient; ctx.fillRect(0, 0, canvas.width, canvas.height * 0.6); // Draw sun/moon ctx.fillStyle = '#FFD93D'; ctx.shadowColor = '#FFD93D'; ctx.shadowBlur = 50; ctx.fillRect( canvas.width * 0.8 + cameraX * 0.5, canvas.height * 0.1 + cameraY * 0.3, 60, 60 ); ctx.shadowBlur = 0; // Draw clouds ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; for (let i = 0; i < 5; i++) { const cloudX = ((i * 300 + animationFrame * 0.3) % (canvas.width + 200)) - 100; const cloudY = 50 + i * 40 + Math.sin(animationFrame * 0.01 + i) * 10; drawPixelCloud(ctx, cloudX + cameraX * 0.2, cloudY + cameraY * 0.2); } // Draw distant mountains/hills ctx.fillStyle = currentBiome.ground; ctx.beginPath(); ctx.moveTo(0, canvas.height * 0.5); for (let x = 0; x <= canvas.width; x += 32) { const y = canvas.height * 0.5 + Math.sin((x + cameraX) * 0.01) * 50 + Math.sin((x + cameraX) * 0.02) * 30; ctx.lineTo(x, y); } ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.closePath(); ctx.fill(); // Draw grass layer ctx.fillStyle = currentBiome.ground; ctx.fillRect(0, canvas.height * 0.55, canvas.width, 10); // Draw dirt layer ctx.fillStyle = currentBiome.dirt; ctx.fillRect(0, canvas.height * 0.55 + 10, canvas.width, canvas.height * 0.45); // Draw pixel grass on top for (let x = 0; x < canvas.width; x += 8) { const grassHeight = 4 + Math.random() * 8; ctx.fillStyle = `rgb(${70 + Math.random() * 30}, ${140 + Math.random() * 40}, ${70 + Math.random() * 20})`; ctx.fillRect(x, canvas.height * 0.55 - grassHeight, 4, grassHeight); } // Draw biome-specific features drawBiomeFeatures(ctx, currentBiome.features, cameraX); // Draw blocks/terrain details for (let x = 0; x < canvas.width; x += 16) { for (let y = canvas.height * 0.6; y < canvas.height; y += 16) { const shade = Math.random() * 20 - 10; ctx.fillStyle = `rgba(0, 0, 0, ${0.05 + Math.random() * 0.05})`; ctx.fillRect(x, y, 16, 16); } } animationFrame++; requestAnimationFrame(drawWorld); } function drawPixelCloud(ctx, x, y) { ctx.fillRect(x, y, 48, 16); ctx.fillRect(x - 16, y + 8, 16, 16); ctx.fillRect(x + 48, y + 4, 24, 16); ctx.fillRect(x + 8, y - 8, 32, 8); } function drawBiomeFeatures(ctx, feature, cameraX) { switch(feature) { case 'trees': for (let i = 0; i < 8; i++) { const treeX = (i * 150 + cameraX * 0.5) % canvas.width; drawPixelTree(ctx, treeX, canvas.height * 0.55); } break; case 'cactus': for (let i = 0; i < 5; i++) { const cactusX = (i * 200 + cameraX * 0.5) % canvas.width; drawPixelCactus(ctx, cactusX, canvas.height * 0.55); } break; case 'peaks': for (let i = 0; i < 3; i++) { const peakX = (i * 300 + cameraX * 0.3) % canvas.width; drawMountainPeak(ctx, peakX, canvas.height * 0.35); } break; case 'waves': drawOceanWaves(ctx, animationFrame); break; default: // Plains - draw flowers for (let i = 0; i < 20; i++) { const flowerX = (i * 80 + cameraX * 0.5) % canvas.width; drawPixelFlower(ctx, flowerX, canvas.height * 0.54); } } } function drawPixelTree(ctx, x, groundY) { // Trunk ctx.fillStyle = '#5D3A1F'; ctx.fillRect(x, groundY - 50, 12, 50); // Leaves ctx.fillStyle = '#228B22'; ctx.fillRect(x - 20, groundY - 90, 52, 40); ctx.fillRect(x - 12, groundY - 110, 36, 20); } function drawPixelCactus(ctx, x, groundY) { ctx.fillStyle = '#228B22'; ctx.fillRect(x, groundY - 60, 16, 60); ctx.fillRect(x - 12, groundY - 40, 12, 24); ctx.fillRect(x + 16, groundY - 50, 12, 24); } function drawMountainPeak(ctx, x, baseY) { ctx.fillStyle = '#696969'; ctx.beginPath(); ctx.moveTo(x, baseY + 150); ctx.lineTo(x + 100, baseY); ctx.lineTo(x + 200, baseY + 150); ctx.closePath(); ctx.fill(); // Snow cap ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.moveTo(x + 70, baseY + 40); ctx.lineTo(x + 100, baseY); ctx.lineTo(x + 130, baseY + 40); ctx.closePath(); ctx.fill(); } function drawOceanWaves(ctx, frame) { ctx.fillStyle = '#0077BE'; for (let x = 0; x < canvas.width; x += 16) { const waveY = canvas.height * 0.5 + Math.sin((x + frame * 2) * 0.05) * 10; ctx.fillRect(x, waveY, 16, canvas.height * 0.1); } } function drawPixelFlower(ctx, x, groundY) { const colors = ['#FF6B6B', '#FFE66D', '#4ECDC4', '#FF69B4']; ctx.fillStyle = '#228B22'; ctx.fillRect(x + 2, groundY - 12, 2, 12); ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)]; ctx.fillRect(x, groundY - 16, 6, 6); } drawWorld(); } // ===== PARTICLES ===== function createParticles() { const welcomeScreen = document.getElementById('welcomeScreen'); for (let i = 0; i < 30; i++) { const particle = document.createElement('div'); particle.className = 'particle'; particle.style.cssText = ` left: ${Math.random() * 100}%; top: ${Math.random() * 100}%; animation-delay: ${-Math.random() * 3}s; background: ${['#5D5', '#3A3', '#7F7', '#2E2'][Math.floor(Math.random() * 4)]}; width: ${4 + Math.random() * 8}px; height: ${4 + Math.random() * 8}px; `; welcomeScreen.appendChild(particle); } } // ===== KEYBOARD SUPPORT ===== document.addEventListener('keydown', function(e) { if (e.key === 'Enter') { const activeElement = document.activeElement; if (activeElement.classList.contains('minecraft-input')) { document.getElementById('loginBtn').click(); } } }); </script> </body> </html>
